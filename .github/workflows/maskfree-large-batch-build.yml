name: Materialize and test bounded candidate batches
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  validate:
    if: github.head_ref == 'fix/maskfree-large-batch-workers' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maskfree-large-batch-workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed changes to exact source blobs
        run: |
          python .bootstrap/apply.py
          git diff --binary > large-batch-implementation.patch
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy scipy nibabel PyYAML tqdm
      - name: Focused regression tests
        run: |
          set -o pipefail
          python -m pytest -q tests/test_maskfree_large_batch.py tests/test_maskfree_candidate_execution.py tests/test_maskfree_runtime_integration.py tests/test_maskfree_runtime_performance.py tests/test_maskfree_prefetch.py tests/test_maskfree_rental_commands.py tests/test_maskfree_performance_profile.py --junitxml=large-batch-tests.xml 2>&1 | tee large-batch-tests.log
          bash -n scripts/run_maskfree_full.sh
          git diff --check
      - name: Commit tested source only to this feature branch
        run: |
          set -e
          mkdir -p reports/maskfree150
          python - <<'PY'
          import json, platform, pathlib, xml.etree.ElementTree as ET
          import torch
          suites = ET.parse('large-batch-tests.xml').getroot()
          rows = [s for s in suites.iter('testsuite')]
          payload = {'scope': 'GitHub-hosted CPU fixtures; NOT rental GPU or real-data timing',
                     'python': platform.python_version(), 'torch': torch.__version__,
                     'tests': sum(int(s.get('tests', 0)) for s in rows),
                     'failures': sum(int(s.get('failures', 0)) for s in rows),
                     'errors': sum(int(s.get('errors', 0)) for s in rows),
                     'skipped': sum(int(s.get('skipped', 0)) for s in rows),
                     'cuda_available': torch.cuda.is_available()}
          pathlib.Path('reports/maskfree150/large_batch_validation.json').write_text(json.dumps(payload, indent=2)+'\n')
          PY
          git rm .bootstrap/apply.py .bootstrap/candidate_execution.py .github/workflows/maskfree-large-batch-build.yml
          git add src/self_audit_maskfree/candidate_execution.py src/self_audit_maskfree/config.py src/self_audit_maskfree/trainer.py scripts/profile_maskfree.py scripts/benchmark_maskfree_rental.py scripts/run_maskfree_full.sh scripts/train_maskfree.py tests/test_maskfree_large_batch.py docs/maskfree_large_batch.md reports/maskfree150/large_batch_validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Support large mask-free batches with bounded candidate worker windows'
          git push origin HEAD:fix/maskfree-large-batch-workers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maskfree-large-batch-tests
          path: |
            large-batch-tests.xml
            large-batch-tests.log
            large-batch-implementation.patch
          retention-days: 7
