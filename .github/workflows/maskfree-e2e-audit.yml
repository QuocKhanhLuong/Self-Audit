name: maskfree-e2e-audit
on:
  push:
    branches: [audit/maskfree-e2e-20260916]
permissions:
  contents: read
jobs:
  test-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download pinned NIfTI dependency for offline tests
        run: |
          mkdir -p /tmp/maskfree-dependencies
          python -m pip download --no-deps --only-binary=:all: nibabel==5.4.2 -d /tmp/maskfree-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: maskfree-audit-dependencies
          path: /tmp/maskfree-dependencies/
          retention-days: 3
          if-no-files-found: error
