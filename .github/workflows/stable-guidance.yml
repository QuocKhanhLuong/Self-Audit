name: stable-guidance-native-preflight
on:
  push:
    branches: [feat/stable-ssl-guidance]
    paths:
      - 'src/self_audit_guidance/**'
      - 'tests/test_self_audit*guidance*.py'
      - 'scripts/*stable_guidance*'
      - '.github/workflows/stable-guidance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU contract and genuine NIfTI dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.15.2 nibabel==5.3.2 pytest==8.3.5
      - name: Native IO plus split/evaluator/gradient contracts
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p native-preflight-results
          python -m pytest -q tests/test_self_audit_stable_guidance.py tests/test_self_audit_guidance_full.py --junitxml=native-preflight-results/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-guidance-native-contracts
          path: native-preflight-results/
  real-checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated upstream CineMA environment
        env:
          PYTHON_BIN: python
          TORCH_VARIANT: cpu
        run: bash scripts/setup_stable_guidance.sh
      - name: Genuine MAE weights and genuine NIfTI parser on explicitly manufactured input
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_XET: '1'
        run: .venv-stable-guidance/bin/python scripts/check_stable_guidance_checkpoint.py --out checkpoint-preflight-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-guidance-real-checkpoint-smoke
          path: checkpoint-preflight-results/
