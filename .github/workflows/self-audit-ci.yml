name: self-audit-ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
      - name: Install the canonical Self-Audit CPU environment (hashed lock)
        run: |
          python -m pip install -r environments/self-audit-canonical/requirements-cpu.lock
      - name: Fail fast unless the canonical environment is active
        run: python scripts/check_environment.py --variant cpu
      - name: Run core and pseudo-label regression/integration tests
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q tests/test_self_audit_*.py tests/test_pseudolabel_*.py --junitxml=test-results/self-audit.xml
      - name: Compile source and tests
        run: python -m py_compile $(find src scripts tests -name "*.py")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-audit-test-results
          path: test-results/
          retention-days: 7
