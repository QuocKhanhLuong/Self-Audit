name: self-audit-ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyyaml pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Self-Audit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_self_audit_*.py
      - name: Compile source and tests
        run: python -m py_compile $(find src scripts tests -name "*.py")
