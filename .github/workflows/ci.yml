name: semi-supervised-v2
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_repo.py && python train.py --describe
      - run: python -m pytest -q
      - run: python experiments/run_mechanisms.py --out /tmp/self-audit-mechanisms
