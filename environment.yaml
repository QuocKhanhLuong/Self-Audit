# Canonical Self-Audit environment (self-audit-canonical v1) for conda users.
# Authoritative definition: environments/self-audit-canonical/environment.json and its
# hashed locks; this file only wraps the CUDA 12.1 lock. See environments/README.md.
# Usage: conda env create -f environment.yaml && conda activate self-audit-canonical
#        python scripts/check_environment.py --variant cu121
# (Replaces the former "specmamba" range specification, whose CineMA/MedSAM2 teacher
# constraints no longer correspond to code in this repository.)
name: self-audit-canonical

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      - -r environments/self-audit-canonical/requirements-cu121.lock
