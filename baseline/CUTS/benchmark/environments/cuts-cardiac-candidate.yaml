# SUPERSEDED: CUTS official runs use the canonical Self-Audit environment
# (environments/self-audit-canonical, v1: Python 3.10, torch 2.4.1 + CUDA 12.1,
# NumPy 1.26.4, phate 2.0.0, sewar 0.4.8). This historical candidate (torch 2.1.2,
# unpinned ranges) is retained for provenance only and must not be used to create
# an environment. See environments/README.md.
# Candidate only. Do not call this a frozen scientific environment until the
# server-side P0 parity, reproducibility, manifest, and real-data smoke gates pass.
name: cuts-cardiac

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - scikit-image
  - nibabel
  - simpleitk
  - pyyaml
  - tqdm
  - matplotlib
  - pandas
  - h5py
  - tabulate
  - pip
  - pip:
      - phate
      - sewar
