# Protocol-level declaration: train unified Self-Audit curriculum on ACDC, then run one frozen
# external evaluation on the M&Ms testing cohort.
protocol: acdc_to_mnms_domain_shift

source_training:
  config: configs/self_audit_full.yaml
  dataset: acdc

external_test:
  dataset: mnms
  split: testing
  data_root: preprocessed_data/mnm
  raw_to_acdc:
    0: 0
    1: 3
    2: 2
    3: 1

image_size: 256
num_classes: 4
depth_axis: 2  # preprocessed M&Ms convention is [H,W,Z]

model:
  encoder_name: convnext_tiny
  # The checkpoint supplies every parameter; external evaluation must not
  # fetch ImageNet weights or depend on network access.
  pretrained_encoder: false
  shared_channels: 96
  num_classes: 4
  window_k: 8
  max_turns: 3

audit:
  tau_accept: 0.0
  t_max: 3
  neutral_margin: 0.005
