# Strict Unified Self-Audit Full Pipeline Configuration (Schema Version 1)
schema_version: 1

experiment:
  name: "self_audit_full"
  protocol: "unified_schedule_v1"
  recipe: "curriculum_v1"
  seed: 42
  deterministic: false
  device: "cuda"

dataset:
  name: "acdc"
  data_root: "preprocessed_data/ACDC"
  split_manifest: "splits/acdc_patient_split_seed42.json"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  image_size: 256
  depth_axis: 2
  representation: "paired_3d"
  class_mapping:
    0: 0
    1: 1
    2: 2
    3: 3
  preprocessing:
    clipping_min: 0.5
    clipping_max: 99.5
    foreground_only: false
  dataloader:
    num_workers: 2
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2

model:
  encoder_name: "convnext_tiny"
  pretrained_encoder: true
  fallback: false
  shared_channels: 96
  num_classes: 4
  window_k: 8
  max_turns: 3

training:
  amp:
    enabled: true
    dtype: "bfloat16"
  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.0001
    grad_clip: 3.0
  lr_curve:
    name: "warmup_cosine"
    warmup_epochs: 5
    min_ratio: 0.0
  annotation_loss:
    stage_weights: [0.5, 0.7, 0.8, 1.0]
  audit_loss:
    audit_margin: 0.05
    neutral_margin: 0.005
    local_class_weighting: "balanced_clamped"
    target_contract: "audit_target_legacy_one_v1"
  counterfactual:
    mixture: [0.4, 0.4, 0.2]
    repair_strength_min: 0.3
    repair_strength_max: 0.6
    epsilon: 0.02
    retries: 8
  rollout:
    tau: 0.0
    max_turns: 3
  schedule:
    total_epochs: 130
    intervals:
      - start_epoch: 0
        end_epoch: 100
        name: "annotation_bootstrap"
        trainable: "annotation"
        encoder_lr: 0.00003
        annotation_lr: 0.0003
        auditor_lr: 0.0
        annotation_weight: 1.0
        audit_weight: 0.0
        objective: "weighted_a0_a3"
        transition_population: "none"
        rollout: "propagate_no_audit"
        batch_size: 4
        accumulation_steps: 1
        augment: true
        reset_optimizer: false
      - start_epoch: 100
        end_epoch: 120
        name: "auditor_training"
        trainable: "auditor"
        encoder_lr: 0.0
        annotation_lr: 0.0
        auditor_lr: 0.0003
        annotation_weight: 0.0
        audit_weight: 1.0
        objective: "counterfactual_audit"
        transition_population: "adjacent_and_synthetic"
        rollout: "annotation_eval"
        batch_size: 4
        accumulation_steps: 1
        augment: false
        reset_optimizer: true
      - start_epoch: 120
        end_epoch: 130
        name: "joint_self_audit"
        trainable: "all"
        encoder_lr: 0.000001
        annotation_lr: 0.00001
        auditor_lr: 0.00001
        annotation_weight: 1.0
        audit_weight: 1.0
        objective: "retained_final_annotation"
        transition_population: "active_attempted"
        rollout: "threshold_gate"
        batch_size: 2
        accumulation_steps: 1
        augment: true
        reset_optimizer: true

checkpoint:
  output_dir: "weights/self_audit_full"
  save_best: true
  save_last: true
  best_selection_min_epoch: 120
  best_metric: "final_foreground_macro_dice"
  best_metric_mode: "max"

calibration:
  enabled: true
  split: "val"
  threshold_min: -0.02
  threshold_max: 0.02
  threshold_steps: 81
  metric_contract: "foreground_dice_exclude_v1"
  metric_space: "slice_proxy"

logging:
  report_dir: "reports/self_audit_full"
  wandb:
    enabled: false
    project: "self-audit"
    entity: null
    run_name: "full-pipeline"
    mode: "offline"
    tags: ["self_audit", "unified", "acdc"]

diagnostics:
  evaluate_headroom: true
  evaluate_decomposition: true
