# Locked Self-Audit baseline, Phase B.
phase: auditor
dataset: acdc
data_root: preprocessed_data/ACDC
split_manifest: splits/acdc_patient_split_seed42.json
train_split: train
val_split: val
test_split: test
image_size: 256
depth_axis: 2  # checked-in preprocessed ACDC convention is [H,W,Z]
num_classes: 4
batch_size: 4
epochs: 20
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
amp: true
warmup_epochs: 5
gradient_accumulation_steps: 1
deterministic: false
seed: 42
device: cuda
auditor_lr: 0.0003
counterfactual:
  epsilon_neutral: 0.02
  neutral_max_retries: 8
  neutral_margin: 0.005
  local_class_weighting: balanced_clamped
output: weights/self_audit/phase_b_auditor.pt
model:
  encoder_name: convnext_tiny
  pretrained_encoder: false
  shared_channels: 96
  num_classes: 4
  window_k: 8
  max_turns: 3
